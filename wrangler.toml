name = "mogiten"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 画面（HTML）は public/ から配信。/api/* だけ Worker が処理する
[assets]
directory = "./public"

# 売上データの保存先（Cloudflare D1）
# `npx wrangler d1 create mogiten` で表示された database_id に書き換えてください
[[d1_databases]]
binding = "DB"
database_name = "mogiten"
database_id = "ここに database_id を貼る"

# レジのパスワードは secret で設定します（このファイルには書かない）
#   npx wrangler secret put ADMIN_PASSWORD
# ローカル開発時は .dev.vars に ADMIN_PASSWORD=xxxx と書く
