<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>定演チケットシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<style>
  /* 入口：各画面へのリンクだけ（ログインは各画面で） */
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  .hero { text-align: center; margin: 12px 0 20px; }
  .hero .app-mark { width: 56px; height: 56px; border-radius: var(--mg-radius-lg); }
  .hero h1 { font-size: var(--mg-text-2xl); margin: 10px 0 4px; }
  .hero p { margin: 0; color: var(--mg-text-sub); font-size: var(--mg-text-sm); }
  .go { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 10px; color: inherit; text-decoration: none; }
  .go .ic { font-size: 30px; width: 44px; text-align: center; flex-shrink: 0; }
  .go b { display: block; font-size: var(--mg-text-lg); }
  .go span { display: block; font-size: var(--mg-text-sm); color: var(--mg-text-sub); line-height: 1.5; }
  .go::after { content: '›'; margin-left: auto; font-size: 28px; color: var(--mg-text-sub); }
  @media (hover: hover) { .go:hover { border-color: var(--mg-primary); } .go:hover b { text-decoration: underline; } }
  .foot { text-align: center; font-size: var(--mg-text-xs); color: var(--mg-text-sub); margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap" role="main">
  <div class="hero">
    <span class="app-mark" aria-hidden="true"></span>
    <h1>定演チケットシステム</h1>
    <p>取り置きの受け渡しと当日券の販売</p>
  </div>

  <a class="card go" href="/reception"><span class="ic" aria-hidden="true">🎫</span><div><b>受付（取り置き）</b><span>取り置きのお客さんを名前で探して、渡したらスワイプ</span></div></a>
  <a class="card go" href="/admin"><span class="ic" aria-hidden="true">🧾</span><div><b>レジ（当日券）</b><span>当日券を売って記録する。今の売上もここで見られます</span></div></a>
  <a class="card go" href="/master"><span class="ic" aria-hidden="true">⚙️</span><div><b>管理画面</b><span>券種・価格、取り置きの CSV の取り込み、売上の CSV</span></div></a>

  <a class="card go" href="/order"><span class="ic" aria-hidden="true">🌐</span><div><b>取り置きのウェブ予約</b><span>お客さん向けの予約ページ（取り置き専用パスワードが必要・開場時刻まで）</span></div></a>

  <div class="foot">受付とレジはレジ用パスワード、管理画面はマスターパスワードでログインします</div>
</div>
</body>
</html>
